services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8090 --reload --reload-dir /app
    ports:
      - "8090:8090"
    env_file: .env
    volumes:
      - .:/app
      - app-data:/app/data
    restart: unless-stopped

  daemon:
    build: .
    command: python -m daemon.main
    env_file: .env
    volumes:
      - .:/app
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
